backend:
  name: github
  repo: georgemegas25/jimmart
  branch: main
  base_url: https://jimmart-cms-auth.georgemegas25.workers.dev
  auth_endpoint: auth

media_folder: "media"
public_folder: "/jimmart/media"

collections:
  - name: "artworks"
    label: "Artworks"
    folder: "content/artworks"
    create: true
    extension: "md"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Paintings", value: "paintings" }
          - { label: "Digital", value: "digital" }
          - { label: "Posters", value: "posters" }
          - { label: "Sculptures", value: "sculptures" }
          - { label: "Installations", value: "installations" }
          - { label: "Illustrations", value: "illustrations" }
          - { label: "Videography", value: "video" }
      - { label: "Dimensions", name: "dimensions", widget: "string", required: false }
      - { label: "Series", name: "series", widget: "string", required: false }
      - { label: "Materials", name: "materials", widget: "string", required: false }


  
  - name: "artist_statement"
    label: "Artist Statement"
    files:
      - label: "Artist Statement & Exhibitions"
        name: "bio"
        file: "content/artist-statement.json"
        format: "json"
        fields:
          - label: "Artist Statement"
            name: "text"
            widget: "text"
          - label: "Exhibitions"
            name: "exhibitions"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }


  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Homepage Artworks"
        name: "homepage"
        file: "content/homepage.json"
        format: "json"
        fields:
          - label: "Paintings"
            name: "paintings"
            widget: "object"
            fields:
              - label: "Left Artwork"
                name: "left"
                widget: "relation"
                collection: "artworks"
                search_fields: ["name"]
                display_fields: ["name"]
                value_field: "{{slug}}"
                filters:
                  - field: "category"
                    values: ["paintings"]
              - label: "Right Artwork"
                name: "right"
                widget: "relation"
                collection: "artworks"
                search_fields: ["name"]
                display_fields: ["name"]
                value_field: "{{slug}}"
                filters:
                  - field: "category"
                    values: ["paintings"]
              
          - label: "Digital"
            name: "digital"
            widget: "object"
            fields:
              - label: "Left Artwork"
                name: "left"
                widget: "relation"
                collection: "artworks"
                search_fields: ["name"]
                display_fields: ["name"]
                value_field: "{{slug}}"
                filters:
                  - field: "category"
                    values: ["digital"]
              - label: "Right Artwork"
                name: "right"
                widget: "relation"
                collection: "artworks"
                search_fields: ["name"]
